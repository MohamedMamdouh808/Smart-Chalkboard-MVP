[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-chalkboard"
version = "0.1.0"
requires-python = ">=3.11"
description = "Smart Chalkboard — deterministic voice + pen classroom board"
dependencies = [
  "PyQt6>=6.6",
  "faster-whisper>=1.0",
  "google-generativeai>=0.5",
  "groq>=0.5",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4", "pytest-cov>=5", "ruff>=0.4", "black>=24", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/smartboard/core"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

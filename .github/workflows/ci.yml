name: CI

on: [push, pull_request]

jobs:
  quality:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: black --check src tests
      - run: mypy src/smartboard/core src/smartboard/persistence
      - run: pytest tests/unit tests/contract -q --cov=src/smartboard/core --cov-report=term-missing --cov-fail-under=95
      - run: pytest tests/integration tests/e2e tests/ui -q
